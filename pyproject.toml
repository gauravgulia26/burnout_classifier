[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "src"
version = "0.0.1"
description = "Reproducible student burnout-risk classification pipeline."
authors = [
  { name = "Gourav" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License"
]
requires-python = "~=3.12.0"
dependencies = [
  "joblib",
  "numpy",
  "pandas",
  "pyarrow",
  "pydantic",
  "fastapi",
  "mlflow>=2,<3",
  "uvicorn[standard]",
  "fastapi[standard]",
  "python-box",
  "PyYAML",
  "rich",
  "requests",
  "scikit-learn",
  "streamlit",
  "typer",
  "xgboost-cpu",
]


[tool.ruff]
line-length = 99
src = ["src"]
include = ["pyproject.toml", "src/**/*.py"]

[tool.fastapi]
entrypoint = "src.backend.main:app"

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["src"]
force-sort-within-sections = true
