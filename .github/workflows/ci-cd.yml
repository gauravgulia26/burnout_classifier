name: Test, register model, and publish image

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: burnout-classifier-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint application code
        run: ruff check main.py src/backend src/frontend tests

      - name: Run test suite
        run: python -m pytest -q

  register-and-publish:
    name: Reproduce model and publish Docker image
    needs: test
    # Image publishing and model registration are protected operations. They
    # happen only after tests succeed on main, or when explicitly dispatched.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_USER_TOKEN }}
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
      DVC_REMOTE_URL: ${{ secrets.DVC_REMOTE_URL }}
      DVC_REMOTE_USERNAME: ${{ secrets.DVC_REMOTE_USERNAME }}
      DVC_REMOTE_PASSWORD: ${{ secrets.DVC_REMOTE_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure and restore DVC data
        shell: bash
        run: |
          test -n "$DVC_REMOTE_URL" || { echo "DVC_REMOTE_URL secret is required."; exit 1; }
          dvc remote add --local --force ci "$DVC_REMOTE_URL"
          if [ -n "$DVC_REMOTE_USERNAME" ]; then
            dvc remote modify --local ci auth basic
            dvc remote modify --local ci user "$DVC_REMOTE_USERNAME"
            dvc remote modify --local ci password "$DVC_REMOTE_PASSWORD"
          fi
          dvc pull --remote ci

      - name: Reproduce and register the current model
        shell: bash
        run: |
          test -n "$DAGSHUB_USER_TOKEN" || { echo "DAGSHUB_USER_TOKEN secret is required."; exit 1; }
          # --force deliberately retrains and registers on every deployment
          # commit, updating the MLflow `champion` alias used by the container.
          dvc repro --force model_registry

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/burnout-classifier
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
